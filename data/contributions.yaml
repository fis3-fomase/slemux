# Kinds of contribution — listed on the Call for papers and Submission pages.
- title: Regular papers
  length: up to 10 pages, excluding references
  text: Original research, new languages, tools, or experience reports.
- title: Short papers
  length: up to 6 pages, excluding references
  text: Work in progress, challenges, new ideas, visions, or cross-paradigm comparisons.
- title: Talk proposals
  length: website only
  text: Presentations of relevant work, including work published elsewhere. Listed on the website, not in the proceedings.
