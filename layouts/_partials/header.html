<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <a class="brand" href="{{ site.Home.RelPermalink }}" aria-label="{{ site.Params.acronym }} — home">
    {{ partial "logo.html" "brand-logo" }}
    <span class="brand-wordmark">{{ partial "wordmark.html" }}</span>
  </a>
  <nav class="nav" aria-label="Main">
    {{ range site.Menus.main }}
    <a href="{{ .URL }}"{{ if $.IsMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
  </nav>
</header>
